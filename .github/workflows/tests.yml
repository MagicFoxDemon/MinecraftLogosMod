# The unit tests and the in-world GameTests, on every pull request and every push to main. Neither needs a display.
# Not run here: the client UI scenarios (-PldTest), and the Touhou Little Maid compat, whose jar is on no Maven
# (the build leaves the compat and its tests out without it). See CONTRIBUTING, section 3.
name: Tests

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# A new push to a pull request stops the run still going on its previous commit.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          # setup-java's own cache rather than gradle/actions: from v6 that one's cache is a closed-source
          # component under separate terms of use.
          cache: gradle

      - name: Unit tests
        run: ./gradlew test

      # Runs even when the unit tests failed, so one run shows both. The server exits with the number of required
      # tests that failed, and under GitHub Actions NeoForge adds an error annotation naming them.
      - name: GameTests
        if: ${{ !cancelled() }}
        run: ./gradlew runGameTestServer

      - name: Upload logs
        if: ${{ failure() }}
        uses: actions/upload-artifact@v7
        with:
          name: test-logs
          path: |
            build/reports/tests/
            run/logs/
            run/crash-reports/
          if-no-files-found: ignore
          retention-days: 14
