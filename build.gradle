plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.148'
    id 'idea'
}

apply from: rootProject.file('gradle/ldlib2-uitest.gradle')
apply from: rootProject.file('gradle/port-models.gradle')

tasks.named('wrapper', Wrapper).configure {
    // Define wrapper values here so as to not have to always do so when updating gradlew.properties.
    // Switching this to Wrapper.DistributionType.ALL will download the full gradle sources that comes with
    // documentation attached on cursor hover of gradle classes and methods. However, this comes with increased
    // file size for Gradle. If you do switch this to ALL, run the Gradle wrapper task twice afterwards.
    // (Verify by checking gradle/wrapper/gradle-wrapper.properties to see if distributionUrl now points to `-all`)
    distributionType = Wrapper.DistributionType.BIN
}

version = mod_version
group = mod_group_id

sourceSets.main.resources {
    // Include resources generated by data generators.
    srcDir('src/generated/resources')

    // Exclude common development only resources from finalized outputs
    exclude("**/*.bbmodel") // BlockBench project files
    exclude("src/generated/**/.cache") // datagen cache files
}

// The Touhou Little Maid jar the maid compat compiles against (see the dependencies below). Without one the compat and
// its tests are left out of the build, and the game runs as it would without the maid mod.
def tlmJar = file(project.findProperty("tlm_jar") ?: "libs/touhoulittlemaid.jar")
if (!tlmJar.exists()) {
    logger.lifecycle("Touhou Little Maid compat left out: no jar at ${tlmJar} (pass -Ptlm_jar=<path>)")
    sourceSets.main.java { exclude 'dev/logos/compat/tlm/**', 'dev/logos/gametest/MaidGameTests.java' }
}

repositories {
    // LDLib2 (UI + node graph toolkit), Photon (VFX), KilaGraph (Photon dependency)
    maven { url = "https://maven.firstdark.dev/snapshots" }
    // GeckoLib (animated entity models), from its own Maven, so the bundled jar carries its real version number.
    exclusiveContent {
        forRepository { maven { url = "https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/" } }
        filter { includeGroup "software.bernie.geckolib" }
    }
    // Optional mods compiled against (Iris, Jade) and the smoke-test mods, from Modrinth's Maven; only the modrinth group is looked up there.
    exclusiveContent {
        forRepository { maven { url = "https://api.modrinth.com/maven" } }
        filter { includeGroup "maven.modrinth" }
    }
    // JEI (optional recipe viewer), from BlameJared's Maven; only JEI and its config library are looked up there.
    exclusiveContent {
        forRepository { maven { url = "https://maven.blamejared.com" } }
        filter { includeGroup "mezz.jei"; includeGroup "net.mezzdev.config" }
    }
    // Add here additional repositories if required by some of the dependencies below.
}

base {
    archivesName = mod_id
}

// Mojang ships Java 21 to end users in 1.21.1, so mods should target Java 21.
java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    // Specify the version of NeoForge to use.
    version = project.neo_version

    // This line is optional. Access Transformers are automatically detected
    // accessTransformers = project.files('src/main/resources/META-INF/accesstransformer.cfg')

    // Default run configurations.
    // These can be tweaked, removed, or duplicated as needed.
    runs {
        client {
            client()
            // Comma-separated list of namespaces to load gametests from. Empty = all namespaces.
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        // This run config launches GameTestServer and runs all registered gametests, then exits.
        // By default, the server will crash when no gametests are provided.
        // The gametest system is also enabled by default for other run configs under the /test command.
        gameTestServer {
            type = "gameTestServer"
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        data {
            clientData()
            // example of overriding the workingDirectory set in configureEach above, uncomment if you want to use it
            // gameDirectory = project.file('run-data')

            // Specify the modid for data generation, where to output the resulting resource, and where to look for existing resources.
            programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
        }

        // applies to all the run configs above
        configureEach {
            // Recommended logging data for a userdev environment
            // The markers can be added/remove as needed separated by commas.
            // "SCAN": For mods scan.
            // "REGISTRIES": For firing of registry events.
            // "REGISTRYDUMP": For getting the contents of all registries.
            systemProperty 'forge.logging.markers', 'REGISTRIES'

            // Recommended logging level for the console
            // You can set various levels here.
            // Please read: https://stackoverflow.com/questions/2031163/when-to-use-the-different-log-levels
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        // define mod <-> source bindings
        // these are used to tell the game which sources are for which mod
        // multi mod projects should define one per mod
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

// Sets up a dependency configuration called 'localRuntime'.
// This configuration should be used instead of 'runtimeOnly' to declare
// a dependency that will be present for runtime testing but that is
// "optional", meaning it will not be pulled by dependents of this mod.
configurations {
    runtimeClasspath.extendsFrom localRuntime
}

dependencies {
    // Example optional mod dependency with JEI
    // The JEI API is declared for compile time use, while the full JEI artifact is used at runtime
    // compileOnly "mezz.jei:jei-${mc_version}-common-api:${jei_version}"
    // compileOnly "mezz.jei:jei-${mc_version}-neoforge-api:${jei_version}"
    // We add the full version to localRuntime, not runtimeOnly, so that we do not publish a dependency on it
    // localRuntime "mezz.jei:jei-${mc_version}-neoforge:${jei_version}"

    // Example mod dependency using a mod jar from ./libs with a flat dir repository
    // This maps to ./libs/coolmod-${mc_version}-${coolmod_version}.jar
    // The group id is ignored when searching -- in this case, it is "blank"
    // implementation "blank:coolmod-${mc_version}:${coolmod_version}"

    // Example mod dependency using a file as dependency
    // implementation files("libs/coolmod-${mc_version}-${coolmod_version}.jar")

    // Example project dependency using a sister or child project:
    // implementation project(":myproject")

    // For more info:
    // http://www.gradle.org/docs/current/userguide/artifact_dependencies_tutorial.html
    // http://www.gradle.org/docs/current/userguide/dependency_management.html
}

// Tests stay out of what players download. Development runs use the compiled classes, so they still have them;
// nothing outside these two packages may refer to them (TestCodeStaysOutTest checks).
tasks.named('jar', Jar) {
    exclude 'dev/logos/gametest/**', 'dev/logos/client/uitest/**'
}

// GeckoLib 4 (1.21.1) reads models from assets/<ns>/geo/ and animations from assets/<ns>/animations/; GeckoLib 5 (26.1)
// from assets/<ns>/geckolib/models/ and geckolib/animations/. The files stay where main keeps them and are copied to
// GeckoLib 4's folders at build time (without this the alchemy table item crashed the creative screen).
var generateGeckoLibAssets = tasks.register("generateGeckoLibAssets", Sync) {
    into layout.buildDirectory.dir("generated/sources/geckolib")
    from("src/main/resources/assets/logos/geckolib/models") { into "assets/logos/geo" }
    from("src/main/resources/assets/logos/geckolib/animations") { into "assets/logos/animations" }
}
sourceSets.main.resources.srcDir generateGeckoLibAssets
neoForge.ideSyncTask generateGeckoLibAssets

// 1.21.1 builds any model whose parents end in builtin/generated from its layer textures alone and drops its elements
// (26.1 draws the elements). Wands and staffs are 3D models with minecraft:item/handheld as parent, so on 1.21.1 they
// came out empty. Item models that have elements and a handheld or generated parent get models/item/port/handheld_elements
// instead: the same display transforms with no generated root. The other model rewrites below (texture objects, chunk
// layers, element rotations, glowing elements, special item renderers) are explained where they happen and in
// gradle/port-models.gradle. The files themselves stay the same as on main.
tasks.named('processResources', ProcessResources) {
    // Gradle does not see changes inside these closures; bump this when they change so the resources are processed again.
    inputs.property("portModelRewrites", 3)
    inputs.file(rootProject.file('gradle/port-models.gradle'))
    // 1.21.1's vanilla resources, for the parents and textures of block models (crops, crosses): see PortModelLayers.
    var vanillaResources = tasks.named('createMinecraftArtifacts').flatMap { it.resourcesArtifact }
    inputs.file(vanillaResources).withPropertyName('vanillaResources').withPathSensitivity(PathSensitivity.NONE)
    var portModelRotations = project.ext.portModelRotations
    var portModelLights = project.ext.portModelLights
    var portModelLayers = project.ext.portModelLayers.newInstance(file('src/main/resources/assets/logos/models'),
            file('src/main/resources/assets/logos/textures'), vanillaResources)
    var portSpecialItems = project.ext.portSpecialItems.newInstance(file('src/main/resources/assets/logos/items'))
    // One pass per model file, so a file can take several of these rewrites.
    filesMatching('assets/logos/models/**/*.json') { details ->
        String text = details.file.text
        boolean block = details.path.startsWith('assets/logos/models/block/')
        boolean item = details.path.startsWith('assets/logos/models/item/')
        boolean special = item && portSpecialItems.isBase(details.path)
        if (!block && !special && !(item && text.contains('"elements"')) && !text.contains('"rotation"') && !text.contains('"light_emission"')) return
        var model = new groovy.json.JsonSlurper().parseText(text)
        boolean changed = false
        // The chunk layer 26.1 picks per quad from the texture's alpha, as NeoForge's render_type: gradle/port-models.gradle.
        String renderType = block ? portModelLayers.renderType(model, details.path) : null
        if (renderType != null) {
            model.render_type = renderType
            changed = true
        }
        // 26.1 lets a model texture be {"sprite": ..., "force_translucent": true}; 1.21.1 wants the sprite name (the
        // translucency is in the render_type above: cultivation jar glass, mana fog, storage tank).
        if (block && model.textures instanceof Map) {
            model.textures.each { k, v ->
                if (v instanceof Map) {
                    model.textures[k] = v.sprite
                    changed = true
                }
            }
        }
        // Element rotations 1.21.1 cannot load (several axes, or angles other than 0, ±22.5, ±45): gradle/port-models.gradle.
        if (portModelRotations.convert(model, details.path) > 0) changed = true
        // Glowing elements ("light_emission") as NeoForge's block light: gradle/port-models.gradle.
        if (portModelLights.convert(model) > 0) changed = true
        if (item && model.containsKey('elements') && model.parent ==~ /(minecraft:)?item\/(handheld|generated)/) {
            model.parent = "logos:item/port/handheld_elements"
            changed = true
        }
        // Item models a special renderer draws (the alchemy table's GeckoLib model): gradle/port-models.gradle.
        if (special && model.parent != "minecraft:builtin/entity") {
            model.parent = "minecraft:builtin/entity"
            changed = true
        }
        if (changed) {
            String out = groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson(model))
            boolean first = true
            details.filter { String line -> if (first) { first = false; return out }; return null }
        }
    }
}

// This block of code expands all declared replace properties in the specified resource targets.
// A missing property will result in an error. Properties are expanded using ${} Groovy notation.
var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}
// Include the output of "generateModMetadata" as an input directory for the build
// this works with both building through Gradle and the IDE.
sourceSets.main.resources.srcDir generateModMetadata
// To avoid having to run "generateModMetadata" manually, make it run on every project reload
neoForge.ideSyncTask generateModMetadata

// 1.21.1 draws an item with models/item/<id>.json; the item definitions in assets/logos/items/ (26.1's, kept the same
// as on main) are read by this task: an item whose definition draws a model of another name gets a model with that one
// as its parent, and a composite one a neoforge:composite model of its parts. Tints are read from the same files at
// run time (client/port/ItemTints); the potion select is client/PotionBottles. Items with a model of their own name
// (or a hand-written one in models/item) are left as they are.
var generateItemModels = tasks.register("generateItemModels") {
    var definitions = file("src/main/resources/assets/logos/items")
    var models = file("src/main/resources/assets/logos/models/item")
    var out = layout.buildDirectory.dir("generated/sources/itemModels")
    inputs.dir definitions
    inputs.dir models
    outputs.dir out
    doLast {
        var target = out.get().dir("assets/logos/models/item").asFile
        target.deleteDir()
        target.mkdirs()
        definitions.listFiles().findAll { it.name.endsWith(".json") }.sort().each { f ->
            String id = f.name - ".json"
            if (new File(models, f.name).exists()) return
            var model = new groovy.json.JsonSlurper().parse(f).model
            var json = null
            if (model.type == "minecraft:model") {
                if (model.model == "logos:item/" + id) return
                json = [parent: model.model]
            } else if (model.type == "minecraft:composite") {
                var parts = model.models.collect { it.model }
                var children = [:]
                parts.eachWithIndex { String p, int i -> children["part_" + i] = [parent: p] }
                json = [parent: parts[0], loader: "neoforge:composite", children: children]
            }
            if (json != null) new File(target, f.name).text = groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson(json)) + "\n"
        }
    }
}
sourceSets.main.resources.srcDir generateItemModels
neoForge.ideSyncTask generateItemModels

// 1.21.1's NeoForge loads only the loot modifiers named in neoforge:loot_modifiers/global_loot_modifiers.json (26.1's
// loads every file); the list is every file in data/logos/loot_modifiers, so main's files need no second place.
var generateLootModifierList = tasks.register("generateLootModifierList") {
    var modifiers = file("src/main/resources/data/logos/loot_modifiers")
    var out = layout.buildDirectory.dir("generated/sources/lootModifiers")
    inputs.dir modifiers
    outputs.dir out
    doLast {
        var target = out.get().file("data/neoforge/loot_modifiers/global_loot_modifiers.json").asFile
        target.parentFile.mkdirs()
        var entries = modifiers.listFiles().findAll { it.name.endsWith(".json") }.collect { "logos:" + (it.name - ".json") }.sort()
        target.text = groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson([replace: false, entries: entries])) + "\n"
    }
}
sourceSets.main.resources.srcDir generateLootModifierList
neoForge.ideSyncTask generateLootModifierList

// Example configuration to allow publishing using the maven-publish plugin
publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/repo"
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8' // Use the UTF-8 charset for Java compilation
}

// IDEA no longer automatically downloads sources/javadoc jars for dependencies, so we need to explicitly enable the behavior.
idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}

dependencies {
    testImplementation 'org.junit.jupiter:junit-jupiter:5.11.4'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test', Test) {
    useJUnitPlatform()
    testLogging { events 'passed', 'failed'; exceptionFormat 'full'; showStandardStreams true }
}

neoForge {
    unitTest {
        enable()
        testedMod = mods."${mod_id}"
    }
}

dependencies {
    // The required mods ship inside the Logos jar (Jar-in-Jar), so players need only the one file. NeoForge loads the
    // highest version on hand: a newer copy a player installs on its own, or one another mod bundles, wins over these.
    // The ranges start at the versions built against. Photon for 1.21.1 is GPL 3.0, not main's CC BY-NC-SA.
    jarJar(implementation("com.lowdragmc.ldlib2:ldlib2-neoforge-1.21.1")) {
        version { strictly "[${ldlib2_version},)"; prefer ldlib2_version }
    }
    jarJar(implementation("com.lowdragmc.photon:photon-neoforge-1.21.1") { transitive = false }) {
        version { strictly "[${photon_version},)"; prefer photon_version }
    }
    // Photon needs KilaGraph and does not bundle it for 1.21.1.
    jarJar(implementation("com.lowdragmc.kilagraph:kilagraph-neoforge-1.21.1") { transitive = false }) {
        version { strictly "[${kilagraph_version},)"; prefer kilagraph_version }
    }
    jarJar(implementation("software.bernie.geckolib:geckolib-neoforge-${minecraft_version}")) {
        version { strictly "[${geckolib_version},)"; prefer geckolib_version }
    }
    // Iris is optional: compiled against for IrisCompat, never required or bundled.
    compileOnly("maven.modrinth:iris:${iris_version}") { transitive = false }
    // JEI is optional: the alchemy table's recipes show in it when it is installed. -Pjei adds it to the dev runs.
    compileOnly "mezz.jei:jei-${minecraft_version}-common-api:${jei_version}"
    compileOnly "mezz.jei:jei-${minecraft_version}-neoforge-api:${jei_version}"
    if (project.hasProperty("jei")) localRuntime "mezz.jei:jei-${minecraft_version}-neoforge:${jei_version}"
    // Touhou Little Maid is optional too (the maid work mode in compat/tlm):
    // it compiles against a local jar, -Ptlm_jar=<path> or libs/touhoulittlemaid.jar, and -Ptlm adds that jar to the dev runs.
    if (tlmJar.exists()) {
        compileOnly files(tlmJar)
        // Jade, for the maid's mana line the maid mod lets compats add to its Jade tooltip; optional, client only.
        compileOnly "maven.modrinth:jade:${jade_version}"
        if (project.hasProperty("jade")) localRuntime "maven.modrinth:jade:${jade_version}"
        if (project.hasProperty("tlm")) localRuntime files(tlmJar)
    }
    // -PcompatMods adds the mods players most often run with to the dev runs, for a smoke test (see CONTRIBUTING); never required or bundled.
    if (project.hasProperty("compatMods")) {
        localRuntime("maven.modrinth:sodium:${sodium_version}") { transitive = false }
        localRuntime("maven.modrinth:iris:${iris_version}") { transitive = false }
        localRuntime("maven.modrinth:lithium:${lithium_version}") { transitive = false }
    }
}
